<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shelf — Curated Picks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div>
      <h1 class="site-title">The Shelf</h1>
      <p class="site-tagline">A running list of things worth owning. Tap anything to see it.</p>
    </div>
    <a class="admin-link" href="admin.html">Admin</a>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">
    No products yet. Head to the <a href="admin.html">admin page</a> to add your first one.
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    As an affiliate, this site may earn a commission from qualifying purchases made through
    links on this page, at no extra cost to you.
  </div>
</footer>

<script src="products.js"></script>
<script>
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const list = (typeof PRODUCTS !== 'undefined') ? PRODUCTS : [];

  if (list.length === 0) {
    empty.style.display = 'block';
  } else {
    list.forEach(p => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = p.link || '#';
      card.target = '_blank';
      card.rel = 'noopener sponsored';

      card.innerHTML = `
        <div class="card-image">
          ${p.image
            ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy">`
            : `<span class="placeholder">${escapeHtml(p.name)}</span>`}
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-desc">${escapeHtml(p.description || '')}</div>
          <div class="card-cta">
            Get it
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 17L17 7M17 7H8M17 7V16"/>
            </svg>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
